name: Feature request
description: Suggest a change to the Action.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        To report a security vulnerability, use [private vulnerability reporting](https://github.com/chamber-security/terraform-evidence-action/security/advisories/new) instead, as [SECURITY.md](https://github.com/chamber-security/terraform-evidence-action/blob/main/SECURITY.md) describes.
  - type: textarea
    id: request
    attributes:
      label: What you'd like
      description: The problem you want solved, and how you'd like the Action to behave.
    validations:
      required: true
